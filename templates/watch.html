{% extends 'base.html' %}

{% block title %}Watch {{ movie.title }} | CINEZONE{% endblock %}

{% block content %}
  <section class="container watch-wrapper">
    <div class="watch-header">
      <span class="eyebrow">Now Playing</span>
      <h1>{{ movie.title }}</h1>
    </div>
    <div class="player-panel">
      <p>Playback is unavailable because no verified source is configured for this title.</p>
    </div>
    <div class="watch-actions">
      <a href="{{ url_for('main.movie_detail', movie_id=movie.id) }}" class="secondary-btn">Back to Details</a>
    </div>
  </section>
{% endblock %}
