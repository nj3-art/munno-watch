{% extends 'base.html' %}
{% block title %}Reset Password | CINEZONE{% endblock %}
{% block content %}
<section class="auth-shell container"><div class="auth-card">
  <span class="eyebrow">Account recovery</span><h1>Reset password</h1>
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <label>New password <input type="password" name="password" minlength="12" maxlength="128" required /></label>
    <button type="submit" class="primary-btn full-width">Set new password</button>
  </form>
</div></section>
{% endblock %}
